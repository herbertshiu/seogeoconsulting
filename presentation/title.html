<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SEO / GEO Authority Building Strategy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Libre+Baskerville:ital@0;1&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #DDE2E5;
            color: #3D4A5C;
            font-family: 'Libre+Baskerville', serif;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .accent-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            background-color: #FFC300;
            border-radius: 50%;
            right: -100px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }

        .content-block {
            padding-left: 80px;
            position: relative;
            z-index: 2;
            max-width: 900px;
        }

        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #0B1D3A;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 96px;
            line-height: 0.95;
            letter-spacing: -0.04em;
            color: #0B1D3A;
            margin-bottom: 40px;
            text-align: left;
        }

        .subtitle {
            font-size: 28px;
            line-height: 1.4;
            max-width: 600px;
            margin-bottom: 60px;
        }

        .footer-info {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 16px;
            color: #3D4A5C;
            margin-top: auto;
            padding-top: 40px;
        }

        .footer-info span {
            font-weight: 600;
            color: #0B1D3A;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-circle"></div>
        <div class="content-block">
            <div class="eyebrow">Strategy Preview</div>
            <h1>Build a signal<br>that lasts.</h1>
            <p class="subtitle">A practical system for making expertise discoverable in search and quotable in AI answers.</p>
            <div class="footer-info">
                September 2026 · <span>seogeoconsulting.hk</span>
            </div>
        </div>
    </div>
</body>
</html>
