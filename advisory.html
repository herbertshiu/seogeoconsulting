        <h1>Advisory note: SEO and GEO issues for companies of any size.</h1>
        <p>The standard does not change with headcount. A clear entity, pages that answer, proof a third party can cite, and URLs that can be retrieved. What changes is the order of operations. This note is for small teams with one site, mid-size teams with several products or markets, and larger organisations that work across sites, agencies, or markets. SEO / GEO Consulting · Hong Kong · 5 October 2026.</p>
        <h2>01 — The entity splits across languages</h2>
        <p>If the English site says “digital transformation partner” and the Chinese site says “foreign-trade exhibition organiser,” search systems cannot reconcile you into one organisation. Pick one category, one primary geography, and one name pair. Repeat that pair in titles, the about page, the footer, public profiles, and schema.org name plus alternateName. Translate the explanation of the category. Do not translate the company into a different business. Search both names. If the category or the city disagrees, fix that sentence before you commission more pages.</p>
        <h2>02 — Priority pages open with a slogan</h2>
        <p>Use the first 50 to 80 words to say who the page is for, which problem it addresses, and what the reader can do next. “Welcome to our innovative logistics platform” does not do that. A useful opening does: “A Hong Kong importer comparing warehouse partners needs three facts first: which districts you cover, how Mainland cross-border orders are handled, and which proof a buyer can check.”</p>
        <h2>03 — Volume without first-hand proof</h2>
        <p>Google defines scaled content abuse as many pages generated for the primary purpose of manipulating search rankings and not helping users, no matter how the pages are created. The examples include generative AI used to produce many pages without adding value. The same spam policies cover attempts to manipulate generative AI responses in Google Search. Add a method, a date, a named source, a constraint, or a detail only your team would know. If you cannot, do not publish the URL.</p>
        <h2>04 — The answer cannot be retrieved</h2>
        <p>Priority URLs should return 200, stay out of robots.txt blocks, appear in the sitemap, and canonicalise to the URL you want cited. Keep Core Web Vitals within the published thresholds: LCP ≤ 2.5 seconds, INP under 200 milliseconds, CLS under 0.1. Put the answer in the initial HTML. Give each full translation its own URL and connect the versions with hreflang. Google recommends different URLs per language and tells sites to avoid side-by-side translations. Do not auto-redirect visitors based on a guessed language. This English note lives at /advisory. The Traditional Chinese note lives at <a href="/zh/advisory">/zh/advisory</a>.</p>
        <h2>05 — The report stops at a rank</h2>
        <p>Keep four numbers: non-branded impressions, qualified organic sessions, assisted conversions, and whether the pages are cited. Where Bing Webmaster Tools shows AI Performance, record citations and grounding queries as a baseline, not a target to game. A small team can do this in Search Console and a spreadsheet. A larger team should segment by language and market. Change a page when the answer is unclear, not because a rank moved by one place.</p>
        <h2>06 — Same standard, different operating rhythm</h2>
        <p>Small teams: freeze the bilingual entity sentence, repair indexation, and rewrite the three URLs that already earn impressions. Do not open a blog programme this quarter. Mid-size teams: build an evidence layer — one dated case, internal links, and a named owner per language — before buying links. Larger organisations: govern the name, category, and claims across sites and agencies. Local teams may localise examples. They should not invent a second category.</p>
        <h2>Do this month</h2>
        <ol>
          <li>Write the entity sentence in English and Traditional Chinese, publish each on its own language version, and record the pair in structured data.</li>
          <li>Choose three URLs that already receive impressions. Confirm status code, canonical, and sitemap inclusion.</li>
          <li>Rewrite the openings so each page answers one question in the first screen.</li>
          <li>Add one proof element per URL: a date, a primary source, a method, or a constraint from your own work.</li>
          <li>Write down non-branded impressions, qualified sessions, and any citation figure you can actually see. Review that baseline next month before you publish anything new.</li>
        </ol>
        <p>This is an advisory note, not an audit and not a promise of rankings or citations. Read the <a href="/playbook">SEO / GEO playbook</a>, use the <a href="/authority">authority scorecard</a>, return to the <a href="/">home page</a>, or <a href="/#contact">request a 30-minute audit</a>.</p>
