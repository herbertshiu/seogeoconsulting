        <h1>諮詢備忘：任何規模的公司都面對的 SEO 與 GEO 問題。</h1>
        <p>標準不隨人數改變。清楚的實體、能回答問題的頁面、第三方可以引用的證明，以及能夠被擷取的網址。會改變的是做事的順序。這份備忘給一個網站的小型團隊、有多個產品或市場的中型團隊，以及跨網站、代理商或市場工作的較大機構。SEO / GEO Consulting · 香港 · 2026年10月5日。網站其餘頁面目前為英文。</p>
        <h2>01 — 實體在兩種語言裡裂開</h2>
        <p>如果英文站寫「數碼轉型夥伴」，中文站寫「外貿展覽主辦機構」，搜尋系統就無法把你還原成同一家機構。選定一個類別、一個主要地理範圍，以及一組名稱。在標題、關於頁、頁尾、對外檔案，以及 schema.org 的 name 與 alternateName 重複這一組。翻譯的是類別的說明，不是把公司譯成另一門生意。分別搜尋兩個名稱。如果類別或城市對不上，先改好這一句，再委託更多頁面。</p>
        <h2>02 — 優先頁面用口號開場</h2>
        <p>用首 50 至 80 字說明給誰、處理什麼問題、讀者下一步可以做什麼。「歡迎來到我們的創新物流平台」做不到。有用的開場做得到：「香港進口商在比較倉庫夥伴時，首先需要三項事實：你覆蓋哪些地區、內地跨境訂單如何處理，以及買家可以核對哪一項證明。」</p>
        <h2>03 — 只有產量，沒有第一手證明</h2>
        <p>Google 把規模化內容濫用界定為：大量頁面的主要目的是操控搜尋排名而不是幫助使用者，不論這些頁面是怎樣產生的。例子包括使用生成式 AI 生產大量沒有附加價值的頁面。同一份垃圾內容政策也涵蓋試圖操控 Google 搜尋中的生成式 AI 回應。補上方法、日期、具名來源、限制，或只有你的團隊才知道的細節。做不到就不要發布該網址。（以上為本站對 Google 政策的譯述。）</p>
        <h2>04 — 答案無法被擷取</h2>
        <p>優先網址應回傳 200、沒有被 robots.txt 封鎖、出現在網站地圖，而且 canonical 指向你希望被引用的網址。Core Web Vitals 維持在已公布的門檻：LCP ≤ 2.5 秒、INP 低於 200 毫秒、CLS 低於 0.1。把答案放在初始 HTML。每個完整譯本使用獨立網址，並以 hreflang 連接。Google 建議不同語言使用不同網址，並要求避免並排翻譯。不要按猜測的語言自動重新導向。英文備忘在 <a href="/advisory">/advisory</a>，繁體中文備忘在 /zh/advisory。</p>
        <h2>05 — 報告停在排名</h2>
        <p>保留四個數字：非品牌曝光、合格的自然工作階段、輔助轉換，以及頁面有沒有被引用。如果 Bing Webmaster Tools 顯示 AI Performance，把引用次數和 grounding queries 記成基線，而不是拿來操弄的目標。小型團隊可以用 Search Console 加一份試算表。較大團隊應按語言和市場分開看。當答案不清楚時才改頁，不要因為排名移動一名就改。</p>
        <h2>06 — 標準相同，節奏不同</h2>
        <p>小型團隊：先凍結雙語實體句，修復索引，並改寫已經有曝光的三個網址。本季不要開網誌計劃。中型團隊：先建立證據層——一個有日期的案例、內部連結、每種語言的具名負責人——再考慮購買連結。較大機構：在網站和代理商之間治理名稱、類別和主張。在地團隊可以在地化例子，但不應發明第二個類別。</p>
        <h2>本月就做</h2>
        <ol>
          <li>用英文和繁體中文各寫一句實體句，放在各自的語言版本，並寫進結構化資料。</li>
          <li>選三個已經有曝光的網址。確認狀態碼、canonical 和網站地圖。</li>
          <li>改寫開場，讓每一頁在第一屏回答一個問題。</li>
          <li>每個網址加上一項證明：日期、原始來源、方法，或來自你自己工作的限制。</li>
          <li>寫下非品牌曝光、合格工作階段，以及你真正看得到的引用數字。下個月先覆核這條基線，再發布新頁。</li>
        </ol>
        <p>這是一份諮詢備忘，不是審計，也不保證排名或引用。可閱讀英文 <a href="/playbook">SEO / GEO 手冊</a>、使用<a href="/authority">權威指標</a>、返回<a href="/">首頁</a>，或<a href="/#contact">預約 30 分鐘審計</a>。</p>
