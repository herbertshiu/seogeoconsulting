        <h1>The SEO / GEO playbook.</h1>
        <p>A practical framework for making expertise discoverable in search and quotable in AI answers. Generative Engine Optimisation (GEO) is not a replacement for SEO. It is the practice of making useful, trustworthy expertise easier for answer engines to retrieve, interpret, and cite.</p>
        <p>Define the entity first. Write the short version a new reader should remember: what your organisation is, where it operates, which problems it solves, and what makes its point of view credible. Repeat that truth consistently across navigation, about pages, profiles, and service pages.</p>
        <p>Answer the intent next. Put a concise answer near the top, then support it with definitions, comparisons, examples, and a clear next step. This is good UX for people and gives retrieval systems clean passages to work with.</p>
        <p>Prove the claim with authorship, sources, methodology, and limitations. Link to primary references when you make a factual claim, and add first-hand details that could not have been produced by skimming the same ten results.</p>
        <p>Measure the mention beyond a position report. Track non-branded impressions, qualified sessions, assisted conversions, returning visitors, and citation or grounding-query signals where platforms provide them.</p>
        <p>Return to the <a href="/">home page</a>, review the <a href="/#case-study">case study</a>, or <a href="/#contact">request a 30-minute audit</a> if you want help applying the framework.</p>
